name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {p=1; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION — refusing to publish."
            echo "::error::Add a '## [$VERSION] - YYYY-MM-DD' section to CHANGELOG.md and re-tag."
            exit 1
          fi
          {
            echo "## axonflow-litellm v${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "pip install axonflow-litellm==${VERSION}"
            echo '```'
            echo ""
            cat /tmp/release-body.md
          } > /tmp/release-body-final.md
          echo "Release body: $(wc -l < /tmp/release-body-final.md) lines"

      - name: Upload release body artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: /tmp/release-body-final.md
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  build:
    needs: [preflight, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in source
        run: |
          set -e
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" axonflow_litellm/_version.py
          echo "Updated version to ${VERSION}"
          grep "^version" pyproject.toml | head -1
          grep "^__version__" axonflow_litellm/_version.py
          if ! grep -q "^version = \"${VERSION}\"" pyproject.toml; then
            echo "::error::sed did not bump pyproject.toml to ${VERSION}"
            exit 1
          fi
          if ! grep -q "^__version__ = \"${VERSION}\"" axonflow_litellm/_version.py; then
            echo "::error::sed did not bump axonflow_litellm/_version.py to ${VERSION}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]" --no-deps && pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  runtime-e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      LLM_MODEL: ollama/llama3.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package from local checkout
        run: pip install -e .

      - name: Record start time
        run: echo "E2E_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run fail-closed-on-stack-down (no stack needed)
        run: bash runtime-e2e/fail-closed-on-stack-down/test.sh

      - name: Run fail-open-on-stack-down (no stack needed)
        run: bash runtime-e2e/fail-open-on-stack-down/test.sh

      - name: Clone AxonFlow platform for docker-compose
        run: |
          git clone --depth 1 https://${{ secrets.GH_SYNC_TOKEN }}@github.com/getaxonflow/axonflow-enterprise.git /tmp/axonflow-enterprise

      - name: Start AxonFlow stack with Ollama
        run: |
          cd /tmp/axonflow-enterprise
          docker compose -f docker-compose.yml -f docker-compose.community-saas.yml up -d --wait --timeout 180
          echo "Waiting for agent health..."
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:8080/health &>/dev/null; then
              echo "AxonFlow stack healthy"
              break
            fi
            sleep 3
          done
          curl -sf http://localhost:8080/health || (echo "FAIL: stack not healthy after 180s" && exit 1)

      - name: Install psql for DB assertions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run sync-completion-policy-fires
        run: bash runtime-e2e/sync-completion-policy-fires/test.sh

      - name: Run async-completion-policy-fires
        run: bash runtime-e2e/async-completion-policy-fires/test.sh

      - name: Run sync-completion-deny
        run: bash runtime-e2e/sync-completion-deny/test.sh

      - name: Run audit-recorded-on-success
        run: bash runtime-e2e/audit-recorded-on-success/test.sh

      - name: Run sync-completion-hitl-approve
        if: env.AXONFLOW_STACK_TIER == 'enterprise'
        run: bash runtime-e2e/sync-completion-hitl-approve/test.sh

      - name: Wall-time floor sanity check
        run: |
          E2E_END=$(date +%s)
          ELAPSED=$((E2E_END - E2E_START))
          echo "Runtime-e2e total: ${ELAPSED}s"
          if [ "$ELAPSED" -lt 30 ]; then
            echo "FAIL: runtime-e2e completed in ${ELAPSED}s — suspiciously fast, likely silent skips"
            exit 1
          fi

      - name: Teardown stack
        if: always()
        run: |
          if [ -d /tmp/axonflow-enterprise ]; then
            cd /tmp/axonflow-enterprise
            docker compose -f docker-compose.yml down -v --timeout 10 || true
          fi

  publish-pypi:
    needs: [build, runtime-e2e]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-release:
    needs: [preflight, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download release body artifact
        uses: actions/download-artifact@v4
        with:
          name: release-body
          path: /tmp/release-body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body/release-body-final.md
          generate_release_notes: false

  verify-publish:
    needs: [preflight, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for PyPI propagation
        run: sleep 30

      - name: Verify package on PyPI
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Checking PyPI for axonflow-litellm==${VERSION}..."
            if pip install --dry-run axonflow-litellm==${VERSION} 2>&1 | grep -q "Would install"; then
              echo "SUCCESS: axonflow-litellm ${VERSION} is available on PyPI"
              exit 0
            fi
            echo "Not yet available, waiting 30 seconds..."
            sleep 30
          done
          echo "FAILURE: axonflow-litellm ${VERSION} not found on PyPI after 5 attempts"
          exit 1
