[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axonflow-litellm"
version = "1.0.0"
description = "AxonFlow governance integration for LiteLLM"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AxonFlow", email = "hello@getaxonflow.com"}]
keywords = ["axonflow", "litellm", "ai-governance", "llm", "policy", "compliance", "guardrails"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "axonflow>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://getaxonflow.com"
Documentation = "https://docs.getaxonflow.com/docs/integration/litellm"
Repository = "https://github.com/getaxonflow/axonflow-litellm"
Changelog = "https://github.com/getaxonflow/axonflow-litellm/blob/main/CHANGELOG.md"
Issues = "https://github.com/getaxonflow/axonflow-litellm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonflow_litellm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
